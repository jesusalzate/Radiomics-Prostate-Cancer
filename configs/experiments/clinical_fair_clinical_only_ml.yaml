train_classical:
  csv: artifacts/clinical/features_clinical_only.csv
  data_pre: artifacts/radiomics
  results_base: results/radiomics/clinical_fair_comparison/ml
  experiment_name: clinical_fair_clinical_only_ml
  feature_strategy: all
  predefined_folds_json: results/radiomics/picai_nnunet_5folds.json
  predefined_fold_id_type: sample_id
  models:
    - Random Forest
    - LightGBM
    - Gradient Boosting
  classification_threshold: 0.5
  threshold_strategy: validation_youden
  probability_calibration: sigmoid
  calibration_inner_splits: 3
  bootstrap_iterations: 1000
  ci_level: 0.95
  tune: true
  tune_n_iter: 20
  tune_inner_splits: 3
  tune_search_n_jobs: 1
  calculate_differences: true
