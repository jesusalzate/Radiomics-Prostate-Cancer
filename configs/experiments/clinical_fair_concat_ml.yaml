train_classical:
  csv: artifacts/radiomics/concatenated_data/features_all_gland_clinical.csv
  data_pre: artifacts/radiomics
  results_base: results/radiomics/clinical_fair_comparison/ml
  experiment_name: clinical_fair_concat_ml_top3_tuned_calibrated
  feature_strategy: most_discriminant
  predefined_folds_json: results/radiomics/picai_nnunet_5folds.json
  predefined_fold_id_type: sample_id
  shared_feature_folds_json: results/radiomics/clinical_fair_comparison/feature_plans/radiomics_plus_clinical_feature_plan.json
  forced_feature_columns:
    - clinical_patient_age
    - clinical_psa
    - clinical_psad
    - clinical_prostate_volume
  models:
    - Random Forest
    - LightGBM
    - Gradient Boosting
  classification_threshold: 0.5
  threshold_strategy: validation_youden
  probability_calibration: sigmoid
  calibration_inner_splits: 3
  bootstrap_iterations: 1000
  ci_level: 0.95
  min_features: 30
  max_features_cap: 100
  samples_per_feature: 15
  minority_samples_per_feature: 5
  fdr_alpha: 0.05
  correlation_threshold: 0.95
  selection_n_jobs: 32
  tune: true
  tune_n_iter: 20
  tune_inner_splits: 3
  tune_search_n_jobs: 1
  calculate_differences: true
