train_classical:
  csv: results/radiomics/picai1500_corr/features/features_all_gland_clinical.csv
  data_pre: artifacts/radiomics
  results_base: results/revision_experiments/isotonic_calibration/ml/concat
  experiment_name: revision_isotonic_concat_ml
  feature_strategy: most_discriminant
  predefined_folds_json: results/radiomics/picai1500_corr/picai_5folds.json
  predefined_fold_id_type: sample_id
  shared_feature_folds_json: results/radiomics/picai1500_corr/feature_plans/radiomics_plus_clinical_feature_plan.json
  forced_feature_columns:
    - clinical_patient_age
    - clinical_psa
    - clinical_psad
    - clinical_prostate_volume
  models:
    - Random Forest
    - LightGBM
    - Gradient Boosting
  classification_threshold: 0.5
  threshold_strategy: validation_youden
  probability_calibration: isotonic
  calibration_inner_splits: 3
  bootstrap_iterations: 1000
  ci_level: 0.95
  selection_cache_dir: results/revision_experiments/shared_cache
  refresh_selection_cache: true
  tune: true
  tune_n_iter: 20
  tune_inner_splits: 3
  tune_search_n_jobs: 1
  calculate_differences: true
