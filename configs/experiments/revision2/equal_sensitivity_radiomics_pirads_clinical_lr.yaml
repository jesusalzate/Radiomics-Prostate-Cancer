train_classical:
  csv: results/pirads_experiments/inputs/features_radiomics_pirads_clinical.csv
  data_pre: artifacts/radiomics
  results_base: results/revision2_experiments/equal_sensitivity/ml/radiomics_pirads_clinical_lr
  experiment_name: equal_sensitivity_radiomics_pirads_clinical_lr
  feature_strategy: most_discriminant
  predefined_folds_json: results/radiomics/picai1500_corr/picai_5folds.json
  predefined_fold_id_type: sample_id
  shared_feature_folds_json: results/pirads_experiments/inputs/feature_plan_radiomics_pirads_clinical.json
  forced_feature_columns:
    - clinical_pirads
    - clinical_patient_age
    - clinical_psa
    - clinical_psad
    - clinical_prostate_volume
  models:
    - Logistic Regression
  classification_threshold: 0.5
  threshold_strategy: validation_youden
  target_sensitivities:
    - 0.9811764705882353
    - 0.9364705882352941
  probability_calibration: sigmoid
  imputer_strategy: mean
  calibration_inner_splits: 3
  bootstrap_iterations: 1000
  ci_level: 0.95
  selection_cache_dir: results/revision2_experiments/shared_cache/equal_sensitivity
  tune: true
  tune_n_iter: 20
  tune_inner_splits: 3
  tune_search_n_jobs: 1
