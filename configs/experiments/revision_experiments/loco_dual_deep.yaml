train_deep:
  csv: results/radiomics/picai1500_corr/features/features_all_gland_clinical.csv
  data_pre: artifacts/radiomics
  output_dir: results/revision_experiments/loco/dl/dual
  run_prefix: revision_loco_dual_refit
  architectures:
    - dual_transformer
    - dual_capsnet
    - dual_transformer_capsnet
  feature_selection: most_discriminant
  predefined_folds_json: results/revision_experiments/inputs/center_loco_folds.json
  shared_feature_folds_json: results/revision_experiments/loco/ml/concat/most_discriminant/clinical/revision_loco_concat_ml/shared_fold_feature_plan.json
  predefined_fold_id_type: sample_id
  min_features: 30
  max_features_cap: 100
  samples_per_feature: 15
  minority_samples_per_feature: 5
  fdr_alpha: 0.05
  correlation_threshold: 0.95
  selection_n_jobs: 7
  batch_size: 16
  epochs: 300
  patience: 50
  threshold_strategy: validation_youden
  probability_calibration: sigmoid
  fold_validation_mode: inner_val
  final_refit_on_outer_train: true
  resume_existing_folds: true
