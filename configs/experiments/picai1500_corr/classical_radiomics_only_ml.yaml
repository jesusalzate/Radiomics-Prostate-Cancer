train_classical:
  csv: features_all_gland.csv
  data_pre: artifacts/radiomics
  results_base: results/radiomics/picai1500_corr/ml/radiomics_only
  experiment_name: picai1500_radiomics_only_ml_top3_tuned_calibrated
  feature_strategy: most_discriminant
  predefined_folds_json: results/radiomics/picai1500_corr/picai_5folds.json
  predefined_fold_id_type: sample_id
  model_summary_csv: artifacts/radiomics/model_selection/picai1295_rank_5x10_summary_metrics.csv
  top_k_models: 3
  classification_threshold: 0.5
  threshold_strategy: validation_youden
  probability_calibration: sigmoid
  calibration_inner_splits: 3
  bootstrap_iterations: 1000
  ci_level: 0.95
  min_features: 30
  max_features_cap: 100
  samples_per_feature: 15
  minority_samples_per_feature: 5
  fdr_alpha: 0.05
  correlation_threshold: 0.95
  selection_n_jobs: 7
  selection_cache_dir: results/radiomics/picai1500_corr/shared_cache
  refresh_selection_cache: true
  tune: true
  tune_n_iter: 20
  tune_inner_splits: 3
  tune_search_n_jobs: 1
  calculate_differences: true
