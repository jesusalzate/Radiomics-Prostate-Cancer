train_deep:
  csv: artifacts/clinical/features_clinical_only.csv
  data_pre: artifacts/radiomics
  output_dir: results/radiomics/clinical_fair_comparison/deep_clinical_only
  run_prefix: clinical_fair_clinical_only_5fold
  architectures:
    - transformer
    - capsnet
    - transformer_capsnet
  feature_selection: none
  predefined_folds_json: results/radiomics/picai_nnunet_5folds.json
  predefined_fold_id_type: sample_id
  batch_size: 16
  epochs: 300
  patience: 50
  threshold_strategy: validation_youden
  probability_calibration: sigmoid
  fold_validation_mode: inner_val
  final_refit_on_outer_train: false
