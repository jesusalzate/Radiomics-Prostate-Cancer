<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">PI-CAI 1500 radiomics workflow</title>
  <desc id="desc">Workflow from MRI radiomics tables through radiomics, clinical, and combined model families to calibrated reports and publication outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#335c67"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17252a; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 13px; }
      .box { fill: #f7f9f9; stroke: #335c67; stroke-width: 2; rx: 8; }
      .data { fill: #e7f0ed; }
      .model { fill: #fff4df; }
      .report { fill: #edf0fa; }
      .arrow { stroke: #335c67; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="360" fill="#ffffff"/>
  <text x="40" y="48" class="title">PI-CAI 1500 Final Experiment</text>
  <text x="40" y="73" class="small">Current main workflow: fixed 5-fold PI-CAI split, calibrated ML/DL models, clinical comparison, and interpretability.</text>

  <rect x="40" y="120" width="180" height="96" class="box data"/>
  <text x="64" y="153" class="label">Inputs</text>
  <text x="64" y="178" class="small">1500 cases</text>
  <text x="64" y="198" class="small">T2W + ADC + DWI</text>

  <rect x="280" y="120" width="180" height="96" class="box data"/>
  <text x="304" y="153" class="label">Features</text>
  <text x="304" y="178" class="small">Gland radiomics</text>
  <text x="304" y="198" class="small">Clinical table</text>

  <rect x="520" y="84" width="190" height="78" class="box model"/>
  <text x="544" y="117" class="label">Radiomics-only</text>
  <text x="544" y="142" class="small">ML + deep tabular</text>

  <rect x="520" y="190" width="190" height="78" class="box model"/>
  <text x="544" y="223" class="label">Clinical models</text>
  <text x="544" y="248" class="small">Clinical-only + concat</text>

  <rect x="770" y="120" width="190" height="96" class="box model"/>
  <text x="794" y="153" class="label">Dual branch DL</text>
  <text x="794" y="178" class="small">Clinical branch</text>
  <text x="794" y="198" class="small">Radiomics branch</text>

  <rect x="1010" y="120" width="70" height="96" class="box report"/>
  <text x="1023" y="153" class="label">Report</text>
  <text x="1023" y="178" class="small">ROC</text>
  <text x="1023" y="198" class="small">PR</text>

  <path d="M220 168 H280" class="arrow"/>
  <path d="M460 156 C490 132, 500 123, 520 123" class="arrow"/>
  <path d="M460 180 C490 206, 500 229, 520 229" class="arrow"/>
  <path d="M710 123 C740 132, 750 145, 770 156" class="arrow"/>
  <path d="M710 229 C740 214, 750 193, 770 180" class="arrow"/>
  <path d="M960 168 H1010" class="arrow"/>
</svg>
